flows:
  quick:
    policy: gated
    stages:
      - lint_verilator
      - sim_icarus

  full:
    policy: gated
    stages:
      - lint_verilator
      - lint_verible
      - sim_icarus
      - sim_verilator

  lint_only:
    policy: run_all
    stages:
      - lint_verilator
      - lint_verible

gates:
  max_errors: 0
  max_warnings: 10
  fail_on_expired_waivers: true
