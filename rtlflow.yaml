flows:
  quick:
    policy: gated
    stages:
      - lint_verilator
      - checks
      - sim_icarus

  full:
    policy: gated
    stages:
      - lint_verilator
      - lint_verible
      - checks
      - sim_icarus
      - sim_verilator

  lint_only:
    policy: run_all
    stages:
      - lint_verilator
      - lint_verible
      - checks

gates:
  max_errors: 0
  max_warnings: 10
  fail_on_expired_waivers: true

checks:
  reset-port-naming:
    enabled: true
    severity: error
    pattern: "^arst_n$"

  no-bare-always:
    enabled: true
    severity: error

  module-filename-match:
    enabled: true
    severity: error
